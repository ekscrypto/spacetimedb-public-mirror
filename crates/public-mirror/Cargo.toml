[package]
name = "spacetimedb-public-mirror-client"
version.workspace = true
edition.workspace = true
license-file = "LICENSE"
description = "Upstream v1 BSATN client and runtime for --public-mirror-v1"
rust-version.workspace = true

[[bin]]
name = "mirror-harness"
path = "src/bin/mirror-harness.rs"

[dependencies]
spacetimedb-client-api-messages.workspace = true
spacetimedb-client-api.workspace = true
spacetimedb-core.workspace = true
spacetimedb-datastore.workspace = true
spacetimedb-lib = { workspace = true, features = ["serde"] }
spacetimedb-primitives.workspace = true
spacetimedb-sats = { workspace = true, features = ["serde"] }
spacetimedb-schema.workspace = true

anyhow.workspace = true
brotli.workspace = true
bytes.workspace = true
flate2.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
futures.workspace = true
futures-util.workspace = true
http.workspace = true
log.workspace = true
reqwest = { workspace = true, features = ["json"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
url.workspace = true

[lints]
workspace = true
